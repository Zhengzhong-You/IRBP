name: Bug report
description: Report a build, solver, input, or numerical issue.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please use a small shareable instance. Do not attach credentials, Gurobi license files, or restricted competition data."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the objective, bound, solver status, or validation error when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Exact command, instance, configuration, seed, thread count, and time limit.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, OS, compiler, CMake, Python, and Gurobi versions as applicable.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or validation output
      description: Paste a short excerpt or attach a minimal shareable reproducer.
