name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Data, configuration, and interface checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate benchmark files and configurations
        run: python scripts/check_repository.py
      - name: Check heuristic solver interface boundary
        run: cmake -DSOURCE_ROOT=heuristic -P cmake/solver_boundary_test.cmake
      - name: Check exact solver interface boundary
        run: cmake -DSOURCE_ROOT=exact -P cmake/solver_boundary_test.cmake
